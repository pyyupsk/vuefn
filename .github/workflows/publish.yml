name: Publish

# Run it by hand from main after the versions in package.json are ready.
# Each package is published only when its version is not on npm yet, so a rerun finishes a partial publish.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.16.0 # zizmor: ignore[adhoc-packages] trusted publishing needs npm 11
      - name: Only from main
        run: test "$GITHUB_REF" = refs/heads/main
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run test:pack
      - name: Release plan
        run: |
          for dir in vuefn create; do
            name=$(jq -r .name "packages/$dir/package.json")
            version=$(jq -r .version "packages/$dir/package.json")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version: already on npm"
            else
              echo "$name@$version: publish"
            fi
          done
      # @vuefn/core first: the starter that @vuefn/create writes points at its version
      - name: Publish
        run: |
          for dir in vuefn create; do
            name=$(jq -r .name "packages/$dir/package.json")
            version=$(jq -r .version "packages/$dir/package.json")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm."
            else
              (cd "packages/$dir" && npm publish)
            fi
          done
