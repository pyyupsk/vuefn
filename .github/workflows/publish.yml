name: Publish

# Run it by hand from main after the versions in package.json are ready.
# Each package is published only when its version is not on npm yet, and gets its own tag and
# GitHub release, <name>@<version>, only when that release does not exist yet. So a rerun
# finishes a partial publish or a missing release.
on:
  workflow_dispatch:

permissions:
  # contents: write lets gh create the tags and the GitHub releases
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # changelogithub reads the history since the last tag of each package
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.16.0 # zizmor: ignore[adhoc-packages] trusted publishing needs npm 11
      - name: Only from main
        run: test "$GITHUB_REF" = refs/heads/main
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run test:pack
      - name: Release plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in vuefn create; do
            tag="$(jq -r .name "packages/$dir/package.json")@$(jq -r .version "packages/$dir/package.json")"
            npm view "$tag" version >/dev/null 2>&1 && npm=on || npm=publish
            gh release view "$tag" >/dev/null 2>&1 && release=on || release=create
            echo "$tag: npm $npm, release $release"
          done
      # @vuefn/core first: the starter that create-vuefn writes points at its version
      - name: Publish and release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for dir in vuefn create; do
            name=$(jq -r .name "packages/$dir/package.json")
            tag="$name@$(jq -r .version "packages/$dir/package.json")"
            if npm view "$tag" version >/dev/null 2>&1; then
              echo "$tag is already on npm."
            else
              (cd "packages/$dir" && npm publish)
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already has a release."
              continue
            fi
            git tag --force "$tag" "$GITHUB_SHA"
            bun scripts/release-notes.ts "$dir" "$tag" notes.md
            latest=false
            if [ "$dir" = vuefn ]; then latest=true; fi
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md --latest="$latest"
          done
